<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151c1b">
  <meta name="description" content="An illustrated spot-the-difference game in three field stations.">
  <title>Field Notes — Spot the Difference</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="sheet">
    <header class="masthead">
      <div class="identity"><span class="monogram" aria-hidden="true">✳</span><div><b>FIELD NOTES</b><span>Spot the difference</span></div></div>
      <div class="station-tabs" id="stations" aria-label="Field stations"></div>
      <button type="button" class="sound" id="sound" aria-pressed="false">Sound off</button>
    </header>
    <main>
      <section class="case" aria-labelledby="title">
        <div class="introduction">
          <div><p class="eyebrow" id="location"></p><h1 id="title"></h1></div>
          <div class="instruments">
            <div class="readout"><span>REMAINING</span><strong id="remaining"></strong><div id="ticks" aria-hidden="true"></div></div>
            <div class="readout clock"><span id="timer-label">TIME LEFT</span><strong id="timer"></strong><div class="track"><i id="time-fill"></i></div></div>
          </div>
        </div>
        <div class="plates">
          <figure><figcaption><b>A</b> Original plate</figcaption><canvas width="640" height="450" id="plate-a" tabindex="0" aria-label="Original illustration. Use arrow keys to aim and Enter or Space to mark."></canvas></figure>
          <figure><figcaption><b>B</b> Comparison plate</figcaption><canvas width="640" height="450" id="plate-b" tabindex="0" aria-label="Comparison illustration. Use arrow keys to aim and Enter or Space to mark."></canvas></figure>
        </div>
        <div class="desk">
          <div class="feedback" id="feedback" role="status"></div>
          <div class="actions">
            <button type="button" id="pause">Pause <kbd>P</kbd></button>
            <button type="button" id="hint">Hint <kbd>H</kbd></button>
            <button type="button" id="advance" class="primary" hidden>Next station <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </section>
      <footer>
        <span>Click either plate to mark a difference. <span class="keyboard">Arrow keys aim · Enter marks</span></span>
        <div class="footer-actions"><button id="restart" type="button">Restart scene</button><button id="relax" type="button" aria-pressed="false">Untimed mode</button></div>
      </footer>
    </main>
  </div>
  <dialog id="pause-dialog" aria-labelledby="pause-title">
    <p class="eyebrow">FIELD NOTES</p><h2 id="pause-title">Taking a break?</h2>
    <p>The plates and the clock will wait here.</p><form method="dialog"><button class="primary">Resume search</button></form>
  </dialog>
  <script type="module" src="./play.js"></script>
</body>
</html>
